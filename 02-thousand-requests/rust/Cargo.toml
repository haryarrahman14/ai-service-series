[package]
name = "thousand-requests-rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# load-dynamic: use libonnxruntime from shared/onnxruntime/, no binary download.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "api-31"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde_json = "=1.0.154"
